name: Build Firmware

on:
  push:
    branches: [ main, master ]
    paths:
      - "core/device_config.h"
      - "**/*.c"
      - "**/*.h"
      - "Makefile"
      - ".github/workflows/build_firmware.yml"
  pull_request:
    paths:
      - "core/device_config.h"
      - "**/*.c"
      - "**/*.h"
      - "Makefile"
      - ".github/workflows/build_firmware.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: recursive

      - name: Extract version number
        id: extract_version
        run: |
          MAJOR=$(grep '#define MAJOR_VERSION' core/device_config.h | awk '{print $3}')
          MINOR=$(grep '#define MINOR_VERSION' core/device_config.h | awk '{print $3}')
          BUILD=$(grep '#define BUILD' core/device_config.h | awk '{print $3}')
          VERSION="${MAJOR}.${MINOR}.${BUILD}"
          VERSION_DASHED="${MAJOR}-${MINOR}-${BUILD}"

          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_DASHED=$VERSION_DASHED" >> $GITHUB_ENV
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "version_dashed=$VERSION_DASHED" >> $GITHUB_OUTPUT

          if [ "$MAJOR" -eq 0 ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Check if release already exists
        id: check_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="v${{ steps.extract_version.outputs.version }}"
          RESPONSE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: token $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/releases/tags/$VERSION)

          if [ "$RESPONSE" == "200" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Download & Install ARM GCC Toolchain
        if: steps.check_release.outputs.exists == 'false'
        run: |
          wget 'https://developer.arm.com/-/media/Files/downloads/gnu/13.3.rel1/binrel/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi.tar.xz' -O compiler.tar.xz
          tar -xf compiler.tar.xz
          echo "$(pwd)/arm-gnu-toolchain-13.3.rel1-x86_64-arm-none-eabi/bin" >> $GITHUB_PATH

      - name: Verify Compiler
        if: steps.check_release.outputs.exists == 'false'
        run: arm-none-eabi-gcc -v

      - name: Build Firmware Variants
        if: steps.check_release.outputs.exists == 'false'
        run: |
          set -e
          # Kept in firmware_artifacts so the next 'make clean' can't wipe them.
          mkdir -p firmware_artifacts
          for b in dingopdm_v7 dingopdmmax_v1 canboard_v2; do
            make clean
            make BOARD=$b
            for ext in hex bin elf srec; do
              cp build/$b.$ext firmware_artifacts/${b}_FW_v${VERSION_DASHED}.$ext
            done
          done
          # The OpenBLT CAN bootloaders, for a blank board's first flash (prebuilt, in the repo)
          cp bootloader/dingopdm/bin/dingopdm_blt.hex bootloader/canboard/bin/canboard_blt.hex firmware_artifacts/
          ls -l firmware_artifacts/
        env:
          VERSION_DASHED: ${{ steps.extract_version.outputs.version_dashed }}

      - name: Create GitHub Release
        if: steps.check_release.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: Release v${{ steps.extract_version.outputs.version }}
          prerelease: ${{ steps.extract_version.outputs.prerelease }}
          generate_release_notes: true
          body: |
            ## Firmware Release v${{ steps.extract_version.outputs.version }}

            One set of files per board (`dingopdm_v7`, `dingopdmmax_v1`, `canboard_v2`):

            | File | Use |
            |---|---|
            | `<board>_FW_v${{ steps.extract_version.outputs.version_dashed }}.srec` | Update over CAN from dingoConfig (*Flash over CAN*) |
            | `<board>_FW_v${{ steps.extract_version.outputs.version_dashed }}.bin` | Update over USB DFU from dingoConfig (*Flash over USB*) |
            | `<board>_FW_v${{ steps.extract_version.outputs.version_dashed }}.hex` | SWD / USB DFU with `flash-dingo.ps1` (with the bootloader on a blank board) |
            | `<board>_FW_v${{ steps.extract_version.outputs.version_dashed }}.elf` | Debugging, CoffeeDingoSim |
            | `dingopdm_blt.hex`, `canboard_blt.hex` | OpenBLT CAN bootloader, flashed once on a blank board |

            The application is linked at 0x08004000 behind the bootloader. A blank board needs the
            bootloader `.hex` and the board's `.hex` together, e.g. `.\flash-dingo.ps1` (downloads both).
          files: firmware_artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
